[project]
name = "documenthub"
version = "0.1.0"
description = "Modular document generation and ingestion library"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "build>=1.3.0",
    "hatchling>=1.28.0",
    "langchain-core>=1.0.0",
    "mypy>=1.19.0",
    "openpyxl>=3.1.5",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=4.4.0",
    "ruff>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "hatchling",
    "build",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documenthub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
